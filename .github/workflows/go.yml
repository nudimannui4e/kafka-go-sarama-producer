name: Go CI

on:
  push:
    branches: ["master"]
    tags:
      - "v*"
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        shell: bash
        run: |
          UNFORMATTED="$(gofmt -l .)"
          if [ -n "$UNFORMATTED" ]; then
            echo "These files are not formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -count=1 -v ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: check

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            filename: kafka-producer-linux-amd64

          - goos: darwin
            goarch: arm64
            filename: kafka-producer-darwin-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build \
            -trimpath \
            -o "dist/${{ matrix.filename }}" \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.filename }}
          path: dist/${{ matrix.filename }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [check, build]

    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: kafka-producer-*
          path: dist
          merge-multiple: true

      - name: Show release files
        run: ls -lah dist

      - name: Create checksums
        working-directory: dist
        run: sha256sum kafka-producer-* > checksums.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; updating assets"

            gh release upload "${GITHUB_REF_NAME}" \
              dist/* \
              --repo "${GH_REPO}" \
              --clobber
          else
            echo "Creating release ${GITHUB_REF_NAME}"

            gh release create "${GITHUB_REF_NAME}" \
              dist/* \
              --repo "${GH_REPO}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
